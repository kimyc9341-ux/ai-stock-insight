<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 주식 종합 예측 & 분석 에이전트</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 940px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .desc {
            color: #94a3b8;
            font-size: 14px;
        }
        .live-status-bar {
            margin-top: 8px;
            font-size: 12px;
            color: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }

        /* 1. 주요 증시 4대 전광판 */
        .index-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .index-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.2s;
        }
        .index-card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }
        .index-title {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
        }
        .index-val {
            font-size: 18px;
            font-weight: 800;
        }
        .index-change {
            font-size: 12px;
            font-weight: 700;
        }

        /* 2. 검색창 영역 */
        .search-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #38bdf8;
        }
        .search-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover {
            background: #1d4ed8;
        }

        /* 3. 탭 메뉴 */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 700;
            padding: 8px 18px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }

        /* 상세 리포트 카드 */
        .report-card {
            background: #1e293b;
            border-radius: 14px;
            border: 1px solid #38bdf8;
            padding: 24px;
            margin-bottom: 24px;
            display: none;
            position: relative;
        }
        .report-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
            margin-bottom: 18px;
        }
        .report-stock-name {
            font-size: 22px;
            font-weight: 800;
        }
        .report-stock-code {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .report-price {
            text-align: right;
        }
        .report-current-price {
            font-size: 24px;
            font-weight: 800;
        }
        .report-change {
            font-size: 13px;
            font-weight: 700;
        }
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }
        .sub-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
        }
        .sub-box-title {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .finance-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .finance-table th, .finance-table td {
            padding: 5px 4px;
            text-align: right;
            border-bottom: 1px solid #1e293b;
        }
        .finance-table th:first-child, .finance-table td:first-child {
            text-align: left;
            color: #94a3b8;
        }
        .news-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .news-item {
            font-size: 12px;
            line-height: 1.4;
            color: #cbd5e1;
            border-left: 2px solid #475569;
            padding-left: 8px;
        }
        .news-item strong {
            color: #f8fafc;
            display: block;
        }
        .ai-analysis-box {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(15, 23, 42, 0.6));
            border: 1px solid #2563eb;
            border-radius: 10px;
            padding: 16px;
        }
        .ai-title {
            font-size: 14px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-badge {
            background: #2563eb;
            color: #ffffff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }
        .ai-text {
            font-size: 13px;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-line;
        }

        /* 6종목 카드 그리드 */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
            gap: 14px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.12);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-name-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-name {
            font-size: 18px;
            font-weight: 700;
        }
        .card-tag {
            font-size: 11px;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .gemini-badge {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }
        .fav-star-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #475569;
            transition: color 0.2s;
        }
        .fav-star-btn.active {
            color: #facc15;
        }
        .card-price {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .card-reason {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.5;
            background: #0f172a;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 2px solid #38bdf8;
        }

        /* KOSPI Top 50 테이블 뷰 */
        .all-table-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }
        .table-view {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .table-view th {
            background: #0f172a;
            padding: 12px 14px;
            color: #94a3b8;
            font-weight: 600;
            text-align: right;
            border-bottom: 1px solid #334155;
        }
        .table-view th:first-child, .table-view td:first-child {
            text-align: center;
            width: 50px;
        }
        .table-view th:nth-child(2), .table-view td:nth-child(2) {
            text-align: left;
        }
        .table-view td {
            padding: 12px 14px;
            text-align: right;
            border-bottom: 1px solid #1e293b;
        }
        .table-view tr:hover td {
            background: #16213e;
            cursor: pointer;
        }

        /* 상승 / 하락 색상 */
        .color-up {
            color: #ef4444 !important;
        }
        .color-down {
            color: #3b82f6 !important;
        }
        .color-even {
            color: #94a3b8 !important;
        }

        .empty-box {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 14px;
            background: #1e293b;
            border-radius: 10px;
            border: 1px dashed #334155;
        }

        @media (max-width: 768px) {
            .index-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .report-grid {
                grid-template-columns: 1fr;
            }
            .stock-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <span class="badge">Live AI Market Intelligence</span>
            <h1>📈 AI 주식 종합 예측 & 분석 에이전트</h1>
            <p class="desc">
                주요 증시 지표 · Google Gemini 추천 주도주 6종목 · KOSPI 시총 Top 50 실시간 순위
            </p>
            <div class="live-status-bar">
                <span class="live-dot"></span>
                <span>실시간 데이터 자동 갱신 중 (<span id="last-updated">수신 중...</span>)</span>
            </div>
        </header>

        <!-- 1. 주요 증시 4대 지표 전광판 -->
        <div id="index-grid" class="index-grid"></div>

        <!-- 2. 종목 검색 섹션 -->
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="종목명 또는 코드 입력 (실시간 검색 / 예: 삼성전자, 카카오, 현대차, 005930)">
                <button type="button" id="search-btn" class="search-btn">종목 조회</button>
            </div>
        </div>

        <!-- 상세 리포트 팝업 영역 -->
        <div id="report-card" class="report-card">
            <button class="report-close-btn" onclick="closeReport()">✕</button>
            <div class="report-header">
                <div>
                    <div id="rep-name" class="report-stock-name">종목명</div>
                    <div id="rep-code" class="report-stock-code">코드 · 시장</div>
                </div>
                <div class="report-price">
                    <div id="rep-price" class="report-current-price">0원</div>
                    <div id="rep-change" class="report-change">-</div>
                </div>
            </div>

            <div class="report-grid">
                <div class="sub-box">
                    <div class="sub-box-title">📊 핵심 재무제표 (최근 결산 실적)</div>
                    <table class="finance-table">
                        <thead>
                            <tr id="finance-thead-tr"></tr>
                        </thead>
                        <tbody id="finance-tbody"></tbody>
                    </table>
                </div>

                <div class="sub-box">
                    <div class="sub-box-title">📰 최근 시장 주요 뉴스 헤드라인</div>
                    <ul id="news-list" class="news-list"></ul>
                </div>
            </div>

            <div class="ai-analysis-box">
                <div class="ai-title">
                    <span>🤖 Google Gemini AI 심층 추천 리포트</span>
                    <span id="rep-gemini-badge" class="ai-badge">추천 분석</span>
                </div>
                <div id="ai-text" class="ai-text">분석 결과를 불러오는 중입니다...</div>
            </div>
        </div>

        <!-- 3. 탭 네비게이션 -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-lead" onclick="switchTab('lead')">🔥 Gemini 추천 주도주 (6종목)</button>
            <button class="tab-btn" id="tab-all" onclick="switchTab('all')">📋 KOSPI 전체 종목 (시총 Top 50)</button>
            <button class="tab-btn" id="tab-fav" onclick="switchTab('fav')">⭐ 내 관심 종목 (<span id="fav-count">0</span>)</button>
        </div>

        <!-- 4-1. Gemini 추천 주도주 6종목 뷰 -->
        <div id="view-lead" class="stock-grid"></div>

        <!-- 4-2. KOSPI 시총 Top 50 뷰 -->
        <div id="view-all" class="all-table-box" style="display:none;">
            <table class="table-view">
                <thead>
                    <tr>
                        <th>관심</th>
                        <th>순위 / 종목명</th>
                        <th>현재가</th>
                        <th>전일대비</th>
                        <th>등락률</th>
                    </tr>
                </thead>
                <tbody id="all-tbody"></tbody>
            </table>
        </div>

        <!-- 4-3. 내 관심 종목 뷰 -->
        <div id="view-fav" class="stock-grid" style="display:none;"></div>
    </div>

    <script>
        let fullData = {
            indexes: [],
            kospi_all: [],
            stocks: {}
        };

        let favorites = JSON.parse(localStorage.getItem('my_favorite_stocks') || '["삼성전자", "SK하이닉스"]');

        async function init() {
            try {
                const res = await fetch('data/stocks.json?t=' + Date.now());
                if (!res.ok) throw new Error("Fetch failed");
                fullData = await res.json();
                
                document.getElementById('last-updated').innerText = fullData.updated_at || "실시간 수신";
                renderIndexes();
                renderLeadStocks6();
                renderKospiTop50();
                renderFavorites();
                updateFavCount();
            } catch (err) {
                console.error("데이터 로드 실패:", err);
                document.getElementById('last-updated').innerText = "오프라인 모드";
            }
        }

        function getColorClass(sign, rate) {
            if (sign === '▲' || parseFloat(rate) > 0) return 'color-up';
            if (sign === '▼' || parseFloat(rate) < 0) return 'color-down';
            return 'color-even';
        }

        function renderIndexes() {
            const container = document.getElementById('index-grid');
            container.innerHTML = '';
            (fullData.indexes || []).forEach(idx => {
                const colorClass = getColorClass(idx.sign, idx.rate);
                const card = document.createElement('div');
                card.className = 'index-card';
                card.innerHTML = `
                    <div class="index-title">${idx.name}</div>
                    <div class="index-val">${idx.price}</div>
                    <div class="index-change ${colorClass}">${idx.sign} ${idx.change} (${idx.rate}%)</div>
                `;
                container.appendChild(card);
            });
        }

        // Gemini 추천 6종목 렌더링
        function renderLeadStocks6() {
            const container = document.getElementById('view-lead');
            container.innerHTML = '';
            const stocks = fullData.stocks || {};

            Object.keys(stocks).forEach(name => {
                const item = stocks[name];
                const price = item.price || {};
                const sign = price.sign || '-';
                const rate = price.change_rate || '0.00';
                const colorClass = getColorClass(sign, rate);
                const isFav = favorites.includes(name);
                const gemini = item.analysis || {};
                const recom = gemini.recommendation || "분할 매수";

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-name-box">
                            <span class="card-name" onclick="selectStock('${name}')">${name}</span>
                            <span class="card-tag">${item.tag || '주도주'}</span>
                            <span class="gemini-badge">Gemini: ${recom}</span>
                        </div>
                        <button class="fav-star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${name}')">★</button>
                    </div>
                    <div class="card-price" onclick="selectStock('${name}')">
                        ${price.price || '0'}원 
                        <span class="${colorClass}" style="font-size:14px; margin-left:6px;">
                            ${sign} ${price.change_val || 0}원 (${rate}%)
                        </span>
                    </div>
                    <p class="card-reason" onclick="selectStock('${name}')">
                        <strong>💡 AI 추천 의견:</strong> ${gemini.analysis ? gemini.analysis.split('\n')[2] || gemini.analysis.split('\n')[0] : '시장 데이터 분석 완료.'}
                    </p>
                `;
                container.appendChild(card);
            });
        }

        // KOSPI Top 50 렌더링
        function renderKospiTop50() {
            const tbody = document.getElementById('all-tbody');
            tbody.innerHTML = '';
            const list = fullData.kospi_all || [];

            list.forEach((item, index) => {
                const rankNum = item.rank && item.rank > 0 ? item.rank : (index + 1);
                const colorClass = getColorClass(item.sign, item.rate);
                const isFav = favorites.includes(item.name);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><button class="fav-star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${item.name}')">★</button></td>
                    <td onclick="selectStock('${item.name}')">
                        <span style="color:#60a5fa; font-weight:700; margin-right:6px;">#${rankNum}</span>
                        <strong>${item.name}</strong> 
                        <span style="font-size:12px; color:#94a3b8;">(${item.code})</span>
                    </td>
                    <td onclick="selectStock('${item.name}')"><strong>${item.price}원</strong></td>
                    <td onclick="selectStock('${item.name}')" class="${colorClass}">${item.sign} ${item.change}원</td>
                    <td onclick="selectStock('${item.name}')" class="${colorClass}"><strong>${item.rate}%</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderFavorites() {
            const container = document.getElementById('view-fav');
            container.innerHTML = '';

            if (favorites.length === 0) {
                container.innerHTML = `<div class="empty-box" style="grid-column: 1 / -1;">등록된 관심 종목이 없습니다. 종목 옆의 별표(★)를 눌러 관심 종목에 등록해 보세요!</div>`;
                return;
            }

            favorites.forEach(name => {
                let item = fullData.stocks ? fullData.stocks[name] : null;
                let price = item ? item.price : null;
                let tag = item ? item.tag : "관심 종목";

                if (!price) {
                    const foundInAll = (fullData.kospi_all || []).find(s => s.name === name);
                    if (foundInAll) {
                        price = {
                            price: foundInAll.price,
                            change_val: foundInAll.change,
                            change_rate: foundInAll.rate,
                            sign: foundInAll.sign,
                            market: "KOSPI"
                        };
                    }
                }

                if (price) {
                    const colorClass = getColorClass(price.sign, price.change_rate);
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="card-name-box">
                                <span class="card-name" onclick="selectStock('${name}')">${name}</span>
                                <span class="card-tag">${tag}</span>
                            </div>
                            <button class="fav-star-btn active" onclick="toggleFavorite(event, '${name}')">★</button>
                        </div>
                        <div class="card-price" onclick="selectStock('${name}')">
                            ${price.price}원 
                            <span class="${colorClass}" style="font-size:14px; margin-left:6px;">
                                ${price.sign} ${price.change_val}원 (${price.change_rate}%)
                            </span>
                        </div>
                        <p class="card-reason" onclick="selectStock('${name}')">내 관심 종목에 등록된 종목입니다. 클릭하여 상세 리포트를 확인하세요.</p>
                    `;
                    container.appendChild(card);
                }
            });
        }

        function toggleFavorite(event, name) {
            event.stopPropagation();
            if (favorites.includes(name)) {
                favorites = favorites.filter(f => f !== name);
            } else {
                favorites.push(name);
            }
            localStorage.setItem('my_favorite_stocks', JSON.stringify(favorites));
            updateFavCount();
            renderLeadStocks6();
            renderKospiTop50();
            renderFavorites();
        }

        function updateFavCount() {
            document.getElementById('fav-count').innerText = favorites.length;
        }

        function switchTab(tab) {
            document.getElementById('tab-lead').classList.remove('active');
            document.getElementById('tab-all').classList.remove('active');
            document.getElementById('tab-fav').classList.remove('active');

            document.getElementById('view-lead').style.display = 'none';
            document.getElementById('view-all').style.display = 'none';
            document.getElementById('view-fav').style.display = 'none';

            if (tab === 'lead') {
                document.getElementById('tab-lead').classList.add('active');
                document.getElementById('view-lead').style.display = 'grid';
            } else if (tab === 'all') {
                document.getElementById('tab-all').classList.add('active');
                document.getElementById('view-all').style.display = 'block';
            } else if (tab === 'fav') {
                document.getElementById('tab-fav').classList.add('active');
                document.getElementById('view-fav').style.display = 'grid';
            }
        }

        function selectStock(name) {
            const item = (fullData.stocks && fullData.stocks[name]) || null;
            const card = document.getElementById('report-card');

            if (item) {
                const price = item.price || {};
                const finance = item.finance || {};
                const news = item.news || [];
                const analysis = item.analysis || {};
                const colorClass = getColorClass(price.sign, price.change_rate);

                document.getElementById('rep-name').innerText = name;
                document.getElementById('rep-code').innerText = `${item.code} · ${price.market || 'KRX'}`;
                document.getElementById('rep-price').innerText = `${price.price || 0}원`;
                
                const repChange = document.getElementById('rep-change');
                repChange.className = `report-change ${colorClass}`;
                repChange.innerText = `${price.sign || '-'} ${price.change_val || 0}원 (${price.change_rate || '0.00'}%)`;

                const theadTr = document.getElementById('finance-thead-tr');
                const tbody = document.getElementById('finance-tbody');
                const years = finance.years || ['전년도', '당해년'];
                theadTr.innerHTML = `<th>구분</th>` + years.map(y => `<th>${y}</th>`).join('');
                
                if (finance.metrics && Object.keys(finance.metrics).length > 0) {
                    tbody.innerHTML = Object.entries(finance.metrics).map(([k, vals]) => {
                        return `<tr><td>${k}</td>${vals.map(v => `<td>${v}</td>`).join('')}</tr>`;
                    }).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="${years.length + 1}">재무제표 데이터 준비 중</td></tr>`;
                }

                const newsList = document.getElementById('news-list');
                if (news && news.length > 0) {
                    newsList.innerHTML = news.map(n => `
                        <li class="news-item">
                            <strong>[${n.office}] ${n.title}</strong>
                            ${n.body ? n.body.slice(0, 85) + '...' : ''}
                        </li>
                    `).join('');
                } else {
                    newsList.innerHTML = `<li class="news-item">최신 뉴스 데이터 준비 중</li>`;
                }

                document.getElementById('rep-gemini-badge').innerText = analysis.recommendation || "추천 분석";
                document.getElementById('ai-text').innerText = analysis.analysis || "분석 리포트가 생성되었습니다.";
            } else {
                const found = (fullData.kospi_all || []).find(s => s.name === name);
                if (found) {
                    const colorClass = getColorClass(found.sign, found.rate);
                    document.getElementById('rep-name').innerText = found.name;
                    document.getElementById('rep-code').innerText = `${found.code} · KOSPI 시총 ${found.rank}위`;
                    document.getElementById('rep-price').innerText = `${found.price}원`;
                    
                    const repChange = document.getElementById('rep-change');
                    repChange.className = `report-change ${colorClass}`;
                    repChange.innerText = `${found.sign} ${found.change}원 (${found.rate}%)`;

                    document.getElementById('finance-thead-tr').innerHTML = `<th>구분</th><th>실시간 지표</th>`;
                    document.getElementById('finance-tbody').innerHTML = `
                        <tr><td>시가총액</td><td>${found.marketValue || '-'}억원</td></tr>
                        <tr><td>시총순위</td><td>KOSPI ${found.rank}위</td></tr>
                    `;
                    document.getElementById('news-list').innerHTML = `<li class="news-item"><strong>${found.name} 실시간 거래 데이터 수신 완료</strong>정상 거래 중입니다.</li>`;
                    document.getElementById('rep-gemini-badge').innerText = "KOSPI 50대 종목";
                    document.getElementById('ai-text').innerText = `KOSPI 시가총액 상위 ${found.rank}위 우량 종목입니다. 현재 ${found.price}원(${found.sign} ${found.rate}%)에 거래되고 있습니다.`;
                }
            }

            card.style.display = 'block';
            card.scrollIntoView({ behavior: 'smooth' });
        }

        function closeReport() {
            document.getElementById('report-card').style.display = 'none';
        }

        document.getElementById('search-btn').addEventListener('click', () => {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            let matched = Object.keys(fullData.stocks || {}).find(k => k.includes(query) || (fullData.stocks[k].code === query));
            if (!matched) {
                const inAll = (fullData.kospi_all || []).find(s => s.name.includes(query) || s.code === query);
                if (inAll) matched = inAll.name;
            }

            if (matched) {
                selectStock(matched);
            } else {
                alert(`'${query}' 종목을 찾을 수 없습니다.`);
            }
        });

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('search-btn').click();
            }
        });

        init();
    </script>
</body>
</html>
