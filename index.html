<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지렁이 게임 (Snake Game)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            color: #e94560;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #4ecca3;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(78, 204, 163, 0.4);
        }
        .header-panel {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #eee;
        }
        .score-box {
            background: #16213e;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #4ecca3;
        }
        canvas {
            display: block;
            background-color: #0f141d;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 20, 29, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            backdrop-filter: blur(4px);
        }
        .overlay h2 {
            font-size: 32px;
            color: #e94560;
            margin-bottom: 10px;
        }
        .overlay p {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(78, 204, 163, 0.4);
        }
        .btn:hover {
            background-color: #45b393;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(78, 204, 163, 0.6);
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #777;
            text-align: center;
            line-height: 1.5;
        }
        .key-tag {
            background: #16213e;
            border: 1px solid #30475e;
            padding: 2px 6px;
            border-radius: 4px;
            color: #4ecca3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🐍 지렁이 게임</h1>
    
    <div class="header-panel">
        <div class="score-box">점수: <span id="score">0</span></div>
        <div class="score-box">최고 점수: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-overlay" class="overlay">
            <h2 id="overlay-title">지렁이 게임</h2>
            <p id="overlay-desc">방향키 또는 WASD로 지렁이를 조작하세요!</p>
            <button id="start-btn" class="btn">게임 시작</button>
        </div>
    </div>

    <div class="instructions">
        조작: <span class="key-tag">↑</span> <span class="key-tag">↓</span> <span class="key-tag">←</span> <span class="key-tag">→</span> 또는 <span class="key-tag">W</span> <span class="key-tag">A</span> <span class="key-tag">S</span> <span class="key-tag">D</span><br>
        일시정지: <span class="key-tag">Space</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const BASE_SPEED = 110; // 밀리초

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameLoopTimeout = null;
        let isRunning = false;
        let isPaused = false;

        highScoreEl.innerText = highScore;

        function resetGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreEl.innerText = score;
            spawnFood();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function handleKeyDown(e) {
            const key = e.key.toLowerCase();

            if (key === ' ' || e.code === 'Space') {
                if (isRunning) {
                    togglePause();
                }
                return;
            }

            if (!isRunning || isPaused) return;

            // 방향키 및 WASD
            if ((key === 'arrowup' || key === 'w') && dy === 0) {
                nextDx = 0;
                nextDy = -1;
            } else if ((key === 'arrowdown' || key === 's') && dy === 0) {
                nextDx = 0;
                nextDy = 1;
            } else if ((key === 'arrowleft' || key === 'a') && dx === 0) {
                nextDx = -1;
                nextDy = 0;
            } else if ((key === 'arrowright' || key === 'd') && dx === 0) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                overlayTitle.innerText = "일시정지";
                overlayDesc.innerText = "스페이스바를 눌러 계속하세요.";
                startBtn.innerText = "계속하기";
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                gameStep();
            }
        }

        function gameStep() {
            if (!isRunning || isPaused) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 감지
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 자기 자신 충돌 감지
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 먹이 섭취
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                    localStorage.setItem('snake_high_score', highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            draw();

            // 점수에 따라 약간씩 빨라지는 효과
            const speed = Math.max(60, BASE_SPEED - Math.floor(score / 50) * 5);
            gameLoopTimeout = setTimeout(gameStep, speed);
        }

        function draw() {
            // 배경 지우기
            ctx.fillStyle = '#0f141d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 그리드 선 그리기
            ctx.strokeStyle = '#16213e';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 먹이 그리기 (빛나는 빨간 열매)
            ctx.fillStyle = '#e94560';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#e94560';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // 지렁이 그리기
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // 머리
                    ctx.fillStyle = '#4ecca3';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#4ecca3';
                } else {
                    // 몸통
                    ctx.fillStyle = '#38a381';
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.roundRect(
                    segment.x * GRID_SIZE + 1.5,
                    segment.y * GRID_SIZE + 1.5,
                    GRID_SIZE - 3,
                    GRID_SIZE - 3,
                    index === 0 ? 6 : 4
                );
                ctx.fill();

                // 머리에 눈 그리기
                if (index === 0) {
                    ctx.fillStyle = '#1a1a2e';
                    const eyeOffset = 4;
                    const eyeSize = 2.5;

                    let eye1 = { x: segment.x * GRID_SIZE + 5, y: segment.y * GRID_SIZE + 5 };
                    let eye2 = { x: segment.x * GRID_SIZE + 15, y: segment.y * GRID_SIZE + 5 };

                    if (dx === 1) { // 오른쪽
                        eye1 = { x: segment.x * GRID_SIZE + 14, y: segment.y * GRID_SIZE + 5 };
                        eye2 = { x: segment.x * GRID_SIZE + 14, y: segment.y * GRID_SIZE + 14 };
                    } else if (dx === -1) { // 왼쪽
                        eye1 = { x: segment.x * GRID_SIZE + 5, y: segment.y * GRID_SIZE + 5 };
                        eye2 = { x: segment.x * GRID_SIZE + 5, y: segment.y * GRID_SIZE + 14 };
                    } else if (dy === 1) { // 아래
                        eye1 = { x: segment.x * GRID_SIZE + 5, y: segment.y * GRID_SIZE + 14 };
                        eye2 = { x: segment.x * GRID_SIZE + 14, y: segment.y * GRID_SIZE + 14 };
                    }

                    ctx.beginPath();
                    ctx.arc(eye1.x, eye1.y, eyeSize, 0, Math.PI * 2);
                    ctx.arc(eye2.x, eye2.y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isRunning = false;
            clearTimeout(gameLoopTimeout);
            overlayTitle.innerText = "게임 오버!";
            overlayDesc.innerText = `최종 점수: ${score}점`;
            startBtn.innerText = "다시 시작";
            overlay.style.display = 'flex';
        }

        function startGame() {
            overlay.style.display = 'none';
            resetGame();
            isRunning = true;
            isPaused = false;
            gameStep();
        }

        startBtn.addEventListener('click', () => {
            if (isPaused) {
                togglePause();
            } else {
                startGame();
            }
        });

        window.addEventListener('keydown', handleKeyDown);

        // 초기 화면 렌더링
        resetGame();
        draw();
    </script>
</body>
</html>
